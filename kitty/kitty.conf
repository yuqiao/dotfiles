# Kitty 终端配置文件 
# 生效配置： 保存文件后，在 Kitty 中按 Cmd + Ctrl + ,

# ============================================================================
# 字体配置
# ============================================================================
font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size        14.0
line_height      1.2

# ============================================================================
# 窗口配置
# ============================================================================
remember_window_size  yes
initial_window_width  120c
initial_window_height 40c
window_padding_width  8
window_padding_height 8
window_border_width   0
draw_minimal_borders  yes
hide_window_decorations titlebar-only

# 背景图片
background_image /Users/qiaoyu/tools/lownagios.png
#background_image_layout scaled
#background_tint 0.98
background_image_layout cscaled
background_opacity 0.90
background_blur 48
background_tint 0.85

# ============================================================================
# 标签页配置
# ============================================================================
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    angled
#tab_title_template     "{title}"
tab_title_template "{index}: {title.split('/')[-1]}"
# active_tab_foreground  #11111b
# active_tab_background  #a6e3a1
# inactive_tab_foreground #cdd6f4
# inactive_tab_background #313244

# ============================================================================
# 主题配置
# ============================================================================
#  选择 theme的命令:  `kitty +kitten themes`
#include gruvbox.conf

# ============================================================================
# 快捷键配置 - macOS 风格（iTerm2 兼容）
# ============================================================================

# 新建标签页
map cmd+t new_tab

# 关闭标签页
map cmd+w close_tab

# 新建窗口
map cmd+n new_os_window

# 垂直分屏
map cmd+d launch --location=vsplit

# 水平分屏
map cmd+shift+d launch --location=hsplit

# 下一个标签页
map cmd+] next_tab

# 上一个标签页
map cmd+[ previous_tab

# 快速切换 Tab (Cmd + 1..9)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# 全屏切换
map cmd+enter toggle_fullscreen

# 打开配置文件
map cmd+, edit_config_file

# 焦点切换 - 上下左右
map cmd+alt+up move_window up
map cmd+alt+down move_window down
map cmd+alt+left move_window left
map cmd+alt+right move_window right

# 调整窗口大小
map cmd+alt+shift+up resize_window taller
map cmd+alt+shift+down resize_window shorter
map cmd+alt+shift+left resize_window narrower
map cmd+alt+shift+right resize_window wider

# ============================================================================
# 性能和其他配置
# ============================================================================
enable_audio_bell    no
visual_bell_duration 0.0
scrollback_lines     10000
copy_on_select       yes
strip_trailing_spaces smart
allow_remote_control yes
listen_on            unix:/tmp/kitty

# ---  链接基础识别设置 ---
detect_urls yes
open_url_with default
url_style curly
# url_color #0087bd

# --- 鼠标点击映射 (像 iTerm2 一样) ---
mouse_map super+left release grabbed,ungrabbed mouse_handle_click lin


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
#
#

# 避免黑屏

# 减少输入延迟的同时，提高恢复时的重绘稳定性
input_delay 3

# 禁用 macOS 的原生标签栏渲染，减少 WindowServer 负担
macos_show_window_title_in window
hide_window_decorations yes

# 强制使用特定的刷新率（匹配你的显示器，如 60 或 120）
# 有助于休眠唤醒后同步渲染时钟
sync_to_monitor yeskkk
