# ==========================
# 基础设置 (The 80/20 Core)
# ==========================

# 将默认的 Prefix 从 Ctrl-b 更改为 Ctrl-a (更靠近左手，类似 screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 开启鼠标支持 (允许使用鼠标调整 Pane 大小、切换 Window 和滚动)
set -g mouse on

# 历史回滚行数增加到 50000 (查看超长报错日志时非常必要)
set -g history-limit 50000

# Window 和 Pane 的索引从 1 开始，而不是 0 (方便键盘横排数字键切换)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
# 终端与 Neovim (LazyVim) 兼容性修复
# ==========================

# 消除 Neovim 中按下 ESC 键的延迟 (极为重要)
set -sg escape-time 10

# 开启 Focus Events，让 Neovim 能够自动重新加载外部修改的文件
set-option -g focus-events on

# 修复 Ghostty / macOS 下的真色彩 (True Color) 支持
# 确保 LazyVim 的主题和高亮在 tmux 中正常渲染
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-ghostty:RGB'


# status-bar
# 左侧：动态显示所有 Session（带索引编号）
set -g status-bg default
set -g status-interval 1
set -g status-left-length 90
set -g status-left "#(~/.config/tmux/tmux-status/left.sh #{q:session_id} #{q:session_name} #{q:client_width} #{q:status-bg})   "

# 右侧：内存、rainbarf、hostname 等
set -g status-right-length 170
set -g status-right "#(~/.config/tmux/tmux-status/right.sh \"#{client_width}\" \"#{status-bg}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_id}\" \"#{window_id}\")"

# ==========================================
# 窗口列表样式 (Window List)
# ==========================================

# 5. 未激活的普通窗口 (暗淡的灰色，降低视觉干扰)
setw -g window-status-format "#[fg=#767676,bg=default] #I:#W "

# 6. 当前激活的窗口 (纯白高亮，略带底色，并加粗)
setw -g window-status-current-format "#[fg=red,bg=default,bold] #I:#W* "

# 7. 窗口之间用空格隔开，更透气
setw -g window-status-separator "  "


# ==========================================
# Session Hooks
# ==========================================

# 新建 session 时触发编号重排
set-hook -gu session-created
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/session_created.sh"'
set-hook -ag session-created 'run -b "tmux refresh-client -S"'

# 关闭 session 时刷新状态栏
set-hook -gu session-closed
set-hook -g session-closed 'run -b "tmux refresh-client -S"'


# ==========================================
# Session 管理
# ==========================================

# 切换到第 N 个 session (Alt + 1~9，无需 Prefix)
bind -n M-1 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 1"
bind -n M-2 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 2"
bind -n M-3 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 3"
bind -n M-4 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 4"
bind -n M-5 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 5"
bind -n M-6 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 6"
bind -n M-7 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 7"
bind -n M-8 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 8"
bind -n M-9 run-shell -b "~/.config/tmux/scripts/switch_session_by_index.sh 9"

# 创建新 session (Alt + Shift + S)
bind -n M-S run-shell "~/.config/tmux/scripts/new_session.sh #{q:session_id}"

# 重命名 session (Prefix + .)
bind . command-prompt -p "Rename session to:" "run-shell \"~/.config/tmux/scripts/rename_session_prompt.sh '%%'\""

# 左/右移动当前 session 位置 (Prefix + < 和 Prefix + >)
bind < run-shell "~/.config/tmux/scripts/move_session.sh left"
bind > run-shell "~/.config/tmux/scripts/move_session.sh right"

# 切换到第 N 个 window (Prefix + 1~9/0)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# Session 选择树 (Prefix + W)
bind W choose-tree -Z


# ==========================
# 快捷键绑定 (Vim 风格)
# ==========================

# 重新加载配置文件 (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Tmux Config Reloaded!"

# 拆分 Pane 的快捷键更直观 (Prefix + - 横向拆分, Prefix + | 纵向拆分)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 使用 Vim 的 hjkl 键在 Pane 之间移动 (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 调整 Pane 大小 (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # 强烈推荐：实现 Neovim 和 Tmux 之间的无缝焦点切换

# 初始化 TPM (必须放在文件最底部)
run '~/.tmux/plugins/tpm/tpm'
